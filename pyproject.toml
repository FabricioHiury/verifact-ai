[project]
name = "verifact-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "celery[redis]>=5.5,<6", "httpx>=0.28,<1",
  "python-multipart>=0.0.20", "jinja2>=3.1,<4", "weasyprint>=65,<70",
  "beautifulsoup4>=4.13,<5", "minio>=7.2,<8", "crewai>=1.0,<2",
]
[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
portable = ["faster-whisper>=1.1,<2"]
diarization = ["pyannote-audio>=4,<5"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15", "types-beautifulsoup4", "types-requests"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["apps/api/verifact", "apps/worker/verifact_worker"]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "apps/worker"]
testpaths = ["tests/unit", "tests/integration", "tests/evaluations"]
markers = ["live: requires local inference and internet"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
mypy_path = ["apps/api", "apps/worker"]
files = ["apps/api/verifact", "apps/worker/verifact_worker"]

[[tool.mypy.overrides]]
module = "verifact_worker.jobs"
disable_error_code = ["untyped-decorator"]
