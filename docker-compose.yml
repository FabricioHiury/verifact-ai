name: verifact
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 384m
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 192m
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY:?}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./infrastructure/searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m
  ollama:
    image: ollama/ollama@sha256:1bef639749741b375e9a1eb2c1346fb57ce52f5432de1f74846e44ccc18e1687
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: "0"
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 4g
  minio:
    image: ${MINIO_IMAGE:-verifact-minio:source-20250907}
    build: infrastructure/docker/minio
    pull_policy: missing
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 256m
  download-proxy:
    profiles: ["media"]
    build:
      context: infrastructure/docker/downloader
      dockerfile: proxy.Dockerfile
    networks: [download-internal, download-egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DOWNLOAD_MAX_BYTES: ${DOWNLOAD_MAX_BYTES:-10737418240}
      DOWNLOAD_TIMEOUT: ${MEDIA_DOWNLOAD_TIMEOUT:-300}
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8888),timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
  downloader:
    profiles: ["media"]
    build: infrastructure/docker/downloader
    networks: [download-internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - "${DOWNLOAD_OUTPUT_DIR:-./data/downloads}:/output"
    environment:
      DOWNLOAD_MAX_BYTES: ${DOWNLOAD_MAX_BYTES:-10737418240}
      DOWNLOAD_TIMEOUT: ${MEDIA_DOWNLOAD_TIMEOUT:-300}
    mem_limit: 512m
    depends_on:
      download-proxy:
        condition: service_healthy

volumes:
  ollama:
  postgres:
  redis:
  minio:

networks:
  download-internal:
    internal: true
  download-egress:
